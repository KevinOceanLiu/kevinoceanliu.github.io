<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://kevinoceanliu.github.io/pages/island.html">
    <meta property="og:url" content="https://kevinoceanliu.github.io/pages/island.html">
    <title>island - Liu Haiyang</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Liu Haiyang</div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="my-news.html">My News</a></li>
                <li><a href="about.html" class="active">Others</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main class="island-page page-with-closing">
        <section class="island-controls" aria-label="Difficulty">
            <span class="island-difficulty-label">Difficulty level</span>
            <button type="button" class="game-button island-difficulty is-active" data-difficulty="level1">1</button>
            <button type="button" class="game-button island-difficulty" data-difficulty="level2">2</button>
            <button type="button" class="game-button island-difficulty" data-difficulty="level3">3</button>
            <button type="button" class="game-button island-difficulty" data-difficulty="level4">4</button>
            <button type="button" class="game-button island-difficulty" data-difficulty="level5">5</button>
        </section>

        <section class="island-shell" aria-label="island game">
            <section class="island-map-panel island-target-map-panel" aria-label="Target island map">
                <div id="island-target-map" class="island-map"></div>
            </section>

            <section class="island-map-panel island-answer-map-panel" aria-label="Answer world map">
                <div id="island-answer-map" class="island-map"></div>
                <button type="button" class="game-button island-confirm" id="island-confirm">Confirm</button>
            </section>
        </section>

        <section class="island-history" aria-label="History">
            <h2>History</h2>
            <ol id="island-history-list"></ol>
        </section>

        <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>

        <section class="page-closing">
            <p class="page-closing-copyright">Copyright © Liu Haiyang. All rights reserved.</p>
            <img src="../images/ocean-muted.png" alt="" class="page-closing-logo" aria-hidden="true">
        </section>
    </main>

    <script src="../js/script.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/island-game.js"></script>
    <script src="../js/visitor-tracker.js"></script>
</body>
</html>
